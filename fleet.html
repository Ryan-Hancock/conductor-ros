<!doctype html>
<!-- Served by conductor. Self-contained: no CDN, no build step. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conductor fleet</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfbfa; --panel: #fff; --line: #e4e4e0; --ink: #1c1c1a; --dim: #6b6b66;
  --accent: #2f6f4f; --warn: #b4551d; --bad: #a3282d; --chip: #f0f0ec;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131413; --panel: #1b1c1b; --line: #2c2e2c; --ink: #e8e8e4; --dim: #9a9a94;
    --accent: #6fbf90; --warn: #e0913f; --bad: #e0666b; --chip: #262826;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
header {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 10;
}
h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
h1 span { color: var(--dim); font-weight: 400; }
.meta { color: var(--dim); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
.meta b { font-weight: 500; color: var(--ink); }
.spacer { flex: 1; }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.dot.paused { background: var(--dim); }
button {
  font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
}
button:hover { border-color: var(--dim); }
main { padding: 20px; display: grid; gap: 20px; max-width: 1500px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
section > h2, .hdrrow h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim);
  margin: 0; padding: 11px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
}
.hdrrow { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.hdrrow h2 { border: 0; flex: 1; }
.hdrrow .chip { margin-right: 16px; }
.body { padding: 14px 16px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--dim); font-size: 11px;
     text-transform: uppercase; letter-spacing: 0.05em; padding: 0 12px 6px 0; white-space: nowrap; }
td { padding: 5px 12px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
code, .mono { font-family: var(--mono); font-size: 12px; }
.chip {
  display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--chip);
  font-size: 11px; font-family: var(--mono); color: var(--dim);
}
.procs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; padding: 14px 16px; }
.proc { border: 1px solid var(--line); border-radius: 7px; padding: 11px 12px; }
.proc.down { border-color: var(--bad); }
.proc h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.proc .sub { color: var(--dim); font-size: 11px; }
.proc .why { color: var(--bad); font-size: 11.5px; font-family: var(--mono); margin-top: 6px; overflow-wrap: anywhere; }
.proc .nodes { margin-top: 8px; }
.proc .n { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; border-top: 1px dotted var(--line); font-size: 12px; }
.proc .n .name { font-family: var(--mono); flex: 1; }
.proc .n .rate { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; }
.state { font-weight: 600; font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase; }
.state.active { color: var(--accent); }
.state.inactive, .state.unconfigured { color: var(--warn); }
.state.finalized, .state.errorprocessing, .state.down { color: var(--bad); }
.finding { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
.finding:first-child { border-top: 0; }
.finding .sev { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; width: 58px; }
.finding.error .sev { color: var(--bad); }
.finding.warning .sev { color: var(--warn); }
.finding .code { font-family: var(--mono); font-size: 11px; color: var(--dim); width: 58px; }
.ok { color: var(--dim); font-size: 13px; padding: 4px 0; }
svg { display: block; width: 100%; height: auto; }
.edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
.edge.busy { stroke: var(--accent); }
.edge.cross { stroke-dasharray: none; }
.nodebox { fill: var(--chip); stroke: var(--line); }
.nodebox.down { stroke: var(--bad); }
.nodelabel { font: 600 12px -apple-system, sans-serif; fill: var(--ink); }
.proclabel { font: 10px var(--mono); fill: var(--dim); }
.topiclabel { font: 11px var(--mono); fill: var(--dim); }
.mission { border-top: 1px solid var(--line); padding: 10px 0; }
.mission:first-child { border-top: 0; padding-top: 0; }
.mission .hdr { display: flex; align-items: baseline; gap: 9px; font-size: 13px; margin-bottom: 8px; }
.chain { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
.step { border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; min-width: 92px; }
.step .n { font-family: var(--mono); font-size: 12px; }
.step .d { color: var(--dim); font-size: 10.5px; white-space: nowrap; }
.step.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.step.current .n { color: var(--accent); font-weight: 600; }
.arrow { align-self: center; color: var(--dim); font-size: 12px; }
.status { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.status.running { color: var(--accent); }
.status.failed { color: var(--bad); }
.status.canceled, .status.idle { color: var(--dim); }
.frame { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 3px 0;
  border-top: 1px dotted var(--line); font-size: 12.5px; }
.frame:first-child { border-top: 0; }
.frame .link { font-family: var(--mono); }
.frame .link em { color: var(--dim); font-style: normal; }
.frame .kind { color: var(--dim); font-size: 11px; white-space: nowrap; }
.frame.dyn .link { color: var(--dim); }
.empty { color: var(--dim); font-size: 13px; padding: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>conductor <span>fleet</span></h1>
  <div class="meta" id="meta"></div>
  <div class="spacer"></div>
  <div class="live"><span class="dot" id="dot"></span><span id="livetext">live</span></div>
  <button id="pause">pause</button>
</header>

<main>
  <section>
    <div class="hdrrow"><h2>findings</h2><span class="chip" id="findhint"></span></div>
    <div class="body" id="findings"></div>
  </section>

  <section>
    <h2>graph</h2>
    <div class="body"><svg id="graph"></svg></div>
  </section>

  <section>
    <div class="hdrrow"><h2>processes</h2><span class="chip" id="prochint"></span></div>
    <div class="procs" id="procs"></div>
  </section>

  <section id="missionsec" hidden>
    <div class="hdrrow"><h2>missions</h2><span class="chip" id="missionhint"></span></div>
    <div class="body" id="missions"></div>
  </section>

  <section>
    <h2>topics</h2>
    <div class="body">
      <table>
        <thead><tr><th>topic</th><th>type</th><th>qos</th><th>publishers</th><th>subscribers</th>
          <th class="num">sent</th><th class="num">received</th><th class="num">msg/s</th></tr></thead>
        <tbody id="topics"></tbody>
      </table>
    </div>
  </section>

  <section id="framesec" hidden>
    <div class="hdrrow"><h2>transforms</h2><span class="chip" id="framehint"></span></div>
    <div class="body" id="frames"></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let paused = false, prevAt = 0, rates = new Map();

$("pause").onclick = () => {
  paused = !paused;
  $("pause").textContent = paused ? "resume" : "pause";
  $("dot").classList.toggle("paused", paused);
  $("livetext").textContent = paused ? "paused" : "live";
  if (!paused) tick();
};

// Same rule as the per-process dashboard: the API exposes absolute counters
// and a timestamp, and rates are derived here from successive snapshots.
function rate(key, value, dt) {
  const before = rates.get(key);
  rates.set(key, value);
  if (before === undefined || dt <= 0 || value < before) return null;
  return (value - before) / dt;
}
const fmtRate = (r) => r === null ? "" : (r >= 100 ? r.toFixed(0) : r >= 10 ? r.toFixed(1) : r.toFixed(2));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const node = (key) => key.slice(key.lastIndexOf("/") + 1);

function renderHeader(s) {
  const errs = s.findings.filter((f) => f.severity === "error").length;
  $("meta").innerHTML = [
    ["processes", `${s.reachable}/${s.processes.length}`],
    ["nodes", s.bringup_order.length],
    ["topics", s.topics.length],
    ["findings", errs ? `${errs} error(s)` : "none"],
  ].map(([k, v]) => `${k} <b>${esc(v)}</b>`).join("");
}

function renderFindings(s) {
  $("findhint").textContent = s.findings.length ? `${s.findings.length}` : "clear";
  if (!s.findings.length) {
    $("findings").innerHTML = '<div class="ok">Every process is answering, every node is active, '
      + 'and no two of them disagree about the graph.</div>';
    return;
  }
  $("findings").innerHTML = s.findings.map((f) =>
    `<div class="finding ${esc(f.severity)}"><span class="sev">${esc(f.severity)}</span>
     <span class="code">${esc(f.code)}</span><span>${esc(f.msg)}</span></div>`).join("");
}

// The union graph: nodes in the fleet's bringup order, edges from whichever
// process publishes to whichever subscribes — the cross-process wiring that
// each process alone can only report as "(ROS graph)".
function renderGraph(s, flows) {
  const svg = $("graph");
  const order = s.bringup_order;
  const col = new Map(order.map((n, i) => [n, i]));
  const down = s.processes.filter((p) => !p.ok).map((p) => p.label);
  const isDown = (key) => down.some((l) => key === l || key.startsWith(l + "/"));
  const W = 168, H = 46, GAPX = 92, GAPY = 26, PAD = 8;
  const rows = new Map();
  const pos = new Map();
  for (const key of order) {
    const c = col.get(key);
    const r = rows.get(c) || 0;
    rows.set(c, r + 1);
    pos.set(key, { x: PAD + c * (W + GAPX), y: PAD + r * (H + GAPY), key });
  }
  const cols = Math.max(1, order.length);
  const maxRow = Math.max(1, ...rows.values());
  const width = PAD * 2 + cols * W + (cols - 1) * GAPX;
  const height = PAD * 2 + maxRow * H + (maxRow - 1) * GAPY + 60;

  const edges = [];
  for (const t of s.topics) {
    for (const p of t.pubs) {
      for (const sub of t.subs) {
        const a = pos.get(p.key), b = pos.get(sub.key);
        if (!a || !b || a === b) continue;
        edges.push({ a, b, topic: t.name, cross: p.process !== sub.process });
      }
    }
  }

  let out = "";
  let lane = 0;
  for (const e of edges) {
    const busy = (flows.get(e.topic) || 0) > 0.05 ? " busy" : "";
    const x1 = e.a.x + W, y1 = e.a.y + H / 2, x2 = e.b.x, y2 = e.b.y + H / 2;
    const far = Math.abs(col.get(e.b.key) - col.get(e.a.key)) > 1 || x2 < x1;
    let d, lx, ly;
    if (far) {
      // Route long edges below the row so they do not cross the boxes.
      const dip = PAD + maxRow * H + (maxRow - 1) * GAPY + 14 + (lane % 3) * 13;
      lane++;
      d = `M${x1},${y1} C${x1 + 40},${dip} ${x2 - 40},${dip} ${x2},${y2}`;
      lx = (x1 + x2) / 2; ly = dip + 2;
    } else {
      const mid = (x1 + x2) / 2;
      d = `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;
      lx = mid; ly = (y1 + y2) / 2 - 5;
    }
    out += `<path class="edge${busy}" d="${d}"/>`;
    out += `<text class="topiclabel" x="${lx}" y="${ly}" text-anchor="middle">${esc(e.topic)}</text>`;
  }
  for (const key of order) {
    const p = pos.get(key);
    const proc = key.slice(0, key.lastIndexOf("/"));
    const bad = isDown(key) ? " down" : "";
    out += `<rect class="nodebox${bad}" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="7"/>`;
    out += `<text class="nodelabel" x="${p.x + W / 2}" y="${p.y + 20}" text-anchor="middle">${esc(node(key))}</text>`;
    out += `<text class="proclabel" x="${p.x + W / 2}" y="${p.y + 35}" text-anchor="middle">${esc(proc)}</text>`;
  }
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.innerHTML = out;
}

function renderProcesses(s, dt) {
  $("prochint").textContent = `${s.reachable} of ${s.processes.length} answering`;
  $("procs").innerHTML = s.processes.map((p) => {
    const title = esc(p.label || p.name || p.url);
    if (!p.ok) {
      return `<div class="proc down"><h3>${title} <span class="state down">down</span></h3>
        <div class="sub">${esc(p.url)}</div><div class="why">${esc(p.err || "no answer")}</div></div>`;
    }
    const up = p.app.uptime_seconds;
    const uptime = up < 90 ? up.toFixed(0) + "s" : up < 5400 ? (up / 60).toFixed(1) + "m" : (up / 3600).toFixed(1) + "h";
    const nodes = p.nodes.map((n) => {
      const r = rate(`node:${p.name}:${n.name}`, n.processed, dt);
      return `<div class="n"><span class="name">${esc(n.name)}</span>
        <span class="state ${esc(n.state.toLowerCase())}">${esc(n.state)}</span>
        <span class="rate">${r === null ? "" : fmtRate(r) + "/s"}${n.dropped ? ` · ${n.dropped} dropped` : ""}</span></div>`;
    }).join("");
    return `<div class="proc"><h3>${title} <span class="chip">${esc(p.app.transport)}</span></h3>
      <div class="sub">${esc(p.app.host)} · pid ${p.app.pid} · up ${uptime} · ${p.latency_ms.toFixed(1)}ms</div>
      <div class="nodes">${nodes}</div></div>`;
  }).join("");
}

function renderTopics(s, dt, flows) {
  $("topics").innerHTML = s.topics.map((t) => {
    // An empty end is only "the ROS graph" if the application says the topic
    // comes from outside it; otherwise it is a hole, and saying so is the
    // whole point of merging.
    const ends = (list) => list.length
      ? list.map((e) => `${esc(e.node)} <span class="chip">${esc(e.process)}</span>`).join(" ")
      : (t.external ? '<span class="chip">ROS graph</span>'
                    : '<span style="color:var(--bad)">nobody</span>');
    return `<tr><td class="mono">${esc(t.name)}</td><td class="mono">${esc(t.type || "")}</td>
      <td><span class="chip">${esc(t.qos || "")}</span></td>
      <td>${ends(t.pubs)}</td><td>${ends(t.subs)}</td>
      <td class="num">${t.sent}</td><td class="num">${t.received}</td>
      <td class="num">${fmtRate(flows.get(t.name) ?? null)}</td></tr>`;
  }).join("") || `<tr><td colspan="8" class="empty">no topics</td></tr>`;
}

function renderMissions(s) {
  const box = $("missionsec");
  box.hidden = !s.missions.length;
  if (box.hidden) return;
  const running = s.missions.filter((m) => m.status === "running").length;
  $("missionhint").textContent = `${running} of ${s.missions.length} running`;
  $("missions").innerHTML = s.missions.map((m) => {
    const chain = m.steps.map((st) => {
      const notes = [];
      if (st.timeout) notes.push("timeout " + st.timeout);
      if (st.retry) notes.push("retry " + st.retry);
      if (st.fail) notes.push("fail → " + st.fail);
      return `<div class="step${st.current ? " current" : ""}">
        <div class="n">${esc(st.name)} <span class="d">${st.entries ? st.entries + "×" : ""}</span></div>
        <div class="d">${esc(notes.join(" · ") || "→ " + st.next)}</div></div>`;
    }).join('<span class="arrow">→</span>');
    const where = m.status === "running"
      ? `at <b>${esc(m.step)}</b> for ${m.elapsed_seconds.toFixed(1)}s` : "";
    return `<div class="mission"><div class="hdr"><b>${esc(m.node)}</b>
      <span class="chip">${esc(m.name)}</span>
      <span class="status ${esc(m.status)}">${esc(m.status)}</span>
      <span style="color:var(--dim);font-size:12px">${where}</span>
      ${m.err ? `<span style="color:var(--bad);font-size:12px">${esc(m.err)}</span>` : ""}</div>
      <div class="chain">${chain}</div></div>`;
  }).join("");
}

function renderFrames(s) {
  const box = $("framesec");
  box.hidden = !s.frames.length;
  if (box.hidden) return;
  const statics = s.frames.filter((f) => !f.dynamic).length;
  $("framehint").textContent = `${statics} static, ${s.frames.length - statics} dynamic`;
  $("frames").innerHTML = s.frames.map((f) => {
    const detail = f.dynamic
      ? `published by ${esc(f.by || "an external node")}`
      : `xyz ${f.xyz.map((v) => v.toFixed(3)).join(" ")} · rpy ${f.rpy.map((v) => v.toFixed(3)).join(" ")}`;
    return `<div class="frame${f.dynamic ? " dyn" : ""}">
      <span class="link">${esc(f.parent)} → ${esc(f.child)} <em>${detail}</em></span>
      <span class="kind">${f.dynamic ? "dynamic" : "static · tf_static"}</span></div>`;
  }).join("");
}

async function tick() {
  if (paused) return;
  let s;
  try {
    s = await (await fetch("/api/fleet")).json();
  } catch (e) {
    $("dot").classList.add("paused");
    $("livetext").textContent = "disconnected";
    return;
  }
  $("dot").classList.remove("paused");
  $("livetext").textContent = "live";
  const now = Date.parse(s.now);
  const dt = prevAt ? (now - prevAt) / 1000 : 0;
  // A topic's rate is what its publishers send; counting deliveries as well
  // would double a topic that has one subscriber.
  const flows = new Map(s.topics.map((t) =>
    [t.name, rate("topic:" + t.name, t.pubs.length ? t.sent : t.received, dt)]));
  renderHeader(s);
  renderFindings(s);
  renderGraph(s, flows);
  renderProcesses(s, dt);
  renderMissions(s);
  renderTopics(s, dt, flows);
  renderFrames(s);
  prevAt = now;
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
